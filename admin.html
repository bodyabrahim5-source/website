<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | إدارة التقييمات</title>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --primary-color: #58a6ff;
            --danger-color: #f85149;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .admin-card {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .admin-header h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-box {
            text-align: center;
            padding: 20px 0;
        }

        .login-box p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #010409;
            color: #fff;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
        }

        .btn-submit {
            background: var(--primary-color);
            color: #0d1117;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .comment-item {
            background: #010409;
            border: 1px solid var(--border-color);
            border-right: 4px solid var(--primary-color);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .comment-info h4 {
            color: var(--primary-color);
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        .comment-info p {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .btn-delete {
            background: rgba(248, 81, 73, 0.15);
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-delete:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .empty-msg {
            text-align: center;
            padding: 30px;
            color: #8b949e;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="admin-header">
        <h2><i class="fa-solid fa-user-shield"></i> لوحة تحكم التقييمات</h2>
        <a href="index.html" style="color: var(--text-color); text-decoration: none; font-size: 0.9rem;">
            <i class="fa-solid fa-arrow-left"></i> العودة للموقع
        </a>
    </div>

    <!-- 🔒 قسم تسجيل الدخول -->
    <div id="loginSection" class="login-box">
        <p>أدخل كلمة المرور للوصول إلى التقييمات والتحكم بها:</p>
        <div class="input-group">
            <input type="password" id="passInput" placeholder="كلمة المرور...">
            <button id="loginBtn" class="btn-submit" onclick="login()">دخول</button>
        </div>
    </div>

    <!-- 📋 قسم عرض التقييمات والحذف -->
    <div id="adminPanel" style="display: none;">
        <h3 style="margin-bottom: 15px; color: #fff;">التقييمات المسجلة أونلاين:</h3>
        <div id="commentsList">
            <p class="empty-msg"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل التقييمات...</p>
        </div>
    </div>
</div>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="admin.js"></script>

</body>
</html>
